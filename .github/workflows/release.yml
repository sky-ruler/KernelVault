name: Release Distribution Packaging

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev qt6-base-dev

      - name: Configure Release Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_GUI=ON

      - name: Compile All Targets
        run: cmake --build build --parallel

      - name: Execute Test Suite
        run: ctest --test-dir build --output-on-failure

      - name: Generate CPack Distribution Packages
        run: |
          mkdir -p dist
          cpack --config build/CPackConfig.cmake -B dist
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
